[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "MiniGPT"
version = "0.1.0"
description = "Build an LLM from Scratch"
requires-python = ">=3.10"
dependencies = []

[tools.setuptools]
package-dir = {"" = "src"}

[tools.setuptools.packages.find]
where = ["src"]
